spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # "lb://booking-service" is not a real host — the LoadBalancer filter resolves it to a live
            # instance via Eureka at request time, so restarting booking-service on a different port
            # leaves this route working unchanged.
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/flights/**,/api/hotels/**,/api/trips/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10   # matches booking/payment-service — local-dev only
    hostname: ${EUREKA_HOSTNAME:localhost}   # see payment-service's application.yml for why this is pinned
    prefer-ip-address: false

# Distributed tracing (OpenTelemetry -> Zipkin). Every trace starts here: the gateway creates the root
# span, and that context rides along to booking-service and on into payment-service via the Kafka saga.
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
